database {
  jdbcUrl = ""
  driver = "org.postgresql.Driver"
  user = ""
  password = ""
}

jwt {
  secret = ${?JWT_SECRET}
  issuer = "pcast-api"
  audience = "pcast-api"
  accessTokenExpireMinutes = 60
  refreshTokenExpireDays = 30
}

passkey {
  rpId = "localhost"
  rpName = "pcast"
  allowedOrigins = ["http://localhost:3000"]
  challengeTtlSeconds = 300
  timeoutMillis = 60000
}
